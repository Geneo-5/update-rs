name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Check formatting
        run: cargo fmt --all --check
      
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Run tests (debug)
        run: cargo test --workspace --all-targets
      
      - name: Run tests (release)
        run: cargo test --workspace --all-targets --release

  fuzz:
    name: Fuzz (5 min per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
      
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      
      - name: Cache fuzz corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: ${{ runner.os }}-fuzz-corpus-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-fuzz-corpus-
      
      - name: Fuzz bundle_header (5 min)
        run: cargo +nightly fuzz run bundle_header -- -max_total_time=300
      
      - name: Fuzz bundle_chunk (5 min)
        run: cargo +nightly fuzz run bundle_chunk -- -max_total_time=300
      
      - name: Fuzz jail_manifest (5 min)
        run: cargo +nightly fuzz run jail_manifest -- -max_total_time=300
      
      - name: Fuzz tpm_command (5 min)
        run: cargo +nightly fuzz run tpm_command -- -max_total_time=300
      
      - name: Fuzz state_machine (5 min)
        run: cargo +nightly fuzz run state_machine -- -max_total_time=300
      
      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/

  cross-compile:
    name: Cross-compile ARMv7 (optionnel)
    runs-on: ubuntu-latest
    # Non bloquant : voir docs/cross-compilation.md
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf
      
      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
      
      - name: Build ARMv7 (release)
        run: cargo build --workspace --target armv7-unknown-linux-gnueabihf --release
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
      
      - name: Upload ARMv7 binaries
        uses: actions/upload-artifact@v4
        with:
          name: armv7-binaries
          path: target/armv7-unknown-linux-gnueabihf/release/

  coverage:
    name: Coverage (≥ 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      
      - name: Generate coverage report
        run: cargo tarpaulin --workspace --fail-under 80 --out Html --out Json
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tarpaulin-report.html

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install cargo-audit
        run: cargo install cargo-audit
      
      - name: Run security audit
        run: cargo audit

  # Job de synthèse : tous les checks doivent passer
  # Note : `cross-compile` a `continue-on-error: true` et n'est donc pas bloquant.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, test, fuzz, coverage, security-audit]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.fuzz.result }}" != "success" ] || \
             [ "${{ needs.coverage.result }}" != "success" ] || \
             [ "${{ needs.security-audit.result }}" != "success" ]; then
            echo "❌ Un ou plusieurs jobs ont échoué"
            exit 1
          fi
          echo "✅ Tous les checks CI passent"

  # Notification Slack (optionnelle) : déclenchée si un job échoue, non-bloquante
  # Configurez `SLACK_WEBHOOK_URL` dans Repository Secrets.
  notify-slack:
    name: Notification Slack
    runs-on: ubuntu-latest
    needs: [ci-success]
    if: always() && needs.ci-success.result == 'failure'
    steps:
      - name: Send Slack notification
        run: |
          if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "⚠️ SLACK_WEBHOOK_URL non configurée, notification ignorée"
            exit 0
          fi
          FAILED=""
          if [ "${{ needs.lint.result }}" = "failure" ]; then FAILED="${FAILED}lint "; fi
          if [ "${{ needs.test.result }}" = "failure" ]; then FAILED="${FAILED}test "; fi
          if [ "${{ needs.fuzz.result }}" = "failure" ]; then FAILED="${FAILED}fuzz "; fi
          if [ "${{ needs.coverage.result }}" = "failure" ]; then FAILED="${FAILED}coverage "; fi
          if [ "${{ needs.security-audit.result }}" = "failure" ]; then FAILED="${FAILED}security-audit "; fi
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg channel "#ci" \
              --arg text "CI update-rs ❌ sur ${{ github.ref_name }} (${{ github.sha }})" \
              --arg fallback "Jobs échoués : ${FAILED:-aucun}" \
              --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{channel: $channel, text: $text, fallback: $fallback, attachments: [{color: "#ff0000", text: ("Jobs échoués : " + $fallback), footer: ("update-rs CI • " + $url)}]}')"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
