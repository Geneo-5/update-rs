[package]
name = "update-bundle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# Hashing
sha2 = { version = "0.10", features = ["oid"] }

# Encryption: AES-256-GCM-SIV (RFC 8452) + AES Key Wrap with Padding (RFC 5649)
aes-gcm-siv = "0.11"
aes-gcm = "0.10"
aes-kw = "0.3"
aes = "0.8"
typenum = "1"

# Serialization (for JailManifest CBOR)
ciborium = "0.2"

# Error handling
thiserror = "2"

# Zeroization of sensitive data
zeroize = "1"

# Bytes handling for streaming
bytes = "1"

# Serialization (serde derive for JailManifest)
serde = { version = "1", features = ["derive"] }

# HKDF key derivation
hkdf = "0.12"

# Constant-time comparison for cryptographic values
subtle = "2"

# Elliptic curve P-256 for ECDSA signature verification
p256 = { version = "0.13", features = ["ecdsa"] }

# Ed25519 signature verification
ed25519-dalek = "1"

# ML-DSA (Dilithium) post-quantum signature verification
ml-dsa = "0.1"

# Test dependencies
[dev-dependencies]
# Arbitrary data generation for fuzzing
arbitrary = { version = "1", features = ["derive"] }
