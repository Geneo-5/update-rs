[package]
name = "update-bundle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# Hashing
sha2 = { version = "0.10", features = ["oid"] }

# Encryption: AES-256-GCM-SIV (RFC 8452) + AES Key Wrap with Padding (RFC 5649)
aes-gcm-siv = { version = "0.11", features = ["alloc"] }
aes-gcm = { version = "0.10", features = ["alloc"] }

# Serialization (for JailManifest CBOR)
ciborium = "0.2"

# Error handling
thiserror = "2"

# Zeroization of sensitive data
zeroize = "1"

# Bytes handling for streaming
bytes = "1"

# Serialization (serde derive for JailManifest)
serde = { version = "1", features = ["derive"] }

# HKDF key derivation
hkdf = "0.12"

# Constant-time comparison for cryptographic values
subtle = "2"

# Test dependencies
[dev-dependencies]
# Arbitrary data generation for fuzzing
arbitrary = { version = "1", features = ["derive"] }
